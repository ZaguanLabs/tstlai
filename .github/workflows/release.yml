name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'require("node:assert/strict").equal(process.env.RELEASE_TAG, "v" + require("./package.json").version)'
      - name: Ensure trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run validate
      - run: npm audit --omit=dev --audit-level=high
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          # OIDC is used when npm trusts this workflow; retain the existing token fallback.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
